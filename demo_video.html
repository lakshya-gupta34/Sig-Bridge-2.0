<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignBridge | Interactive Working Video Showcase & Recorder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #080c14;
      color: #f8fafc;
    }
    .font-hindi { font-family: 'Noto Sans Devanagari', sans-serif; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(51, 65, 85, 0.7);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="p-4 border-b border-slate-800 bg-slate-900/90 flex flex-col sm:flex-row items-center justify-between gap-3">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold">🎬</div>
      <div>
        <h1 class="text-base font-bold text-slate-100 flex items-center space-x-2">
          <span>SignBridge &bull; Interactive Video Showcase &amp; Recorder</span>
          <span class="px-2 py-0.5 text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full font-mono">Real-Time Demo</span>
        </h1>
        <p class="text-xs text-slate-400">Play the simulated live demo walkthrough or click "Record &amp; Download Video" to export an MP4/WebM video.</p>
      </div>
    </div>

    <!-- Recorder Actions -->
    <div class="flex items-center space-x-3">
      <button id="btn-record-video" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-rose-600/30 transition-all flex items-center space-x-2">
        <span class="w-2.5 h-2.5 rounded-full bg-white animate-ping"></span>
        <span id="record-btn-text">🎬 Record &amp; Export Video (.webm)</span>
      </button>
      <a href="index.html" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700 transition-colors">
        &larr; Back to Dashboard
      </a>
    </div>
  </header>

  <!-- Video Stage Canvas Container -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-8">
    <div class="w-full max-w-4xl bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl relative flex flex-col">
      
      <!-- Top Video Player Header HUD -->
      <div class="p-3 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400">
        <div class="flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="scene-title-hud" class="font-semibold text-slate-200">Scene 1: Introduction &amp; Demographic Reality</span>
        </div>
        <div class="font-mono text-sky-400 font-bold" id="video-timer">00:00 / 01:30</div>
      </div>

      <!-- Main Video Canvas (960 x 540 HD 16:9) -->
      <div class="relative w-full aspect-video bg-[#090d16]">
        <canvas id="video-canvas" width="960" height="540" class="w-full h-full block"></canvas>
      </div>

      <!-- Bottom Player Controls -->
      <div class="p-4 bg-slate-900/90 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="flex items-center space-x-2">
          <button id="btn-play-pause" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold rounded-lg transition-colors">
            ▶ Play Walkthrough
          </button>
          <button id="btn-restart" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg border border-slate-700 transition-colors">
            &#8634; Restart
          </button>
        </div>

        <!-- Scene Selector Pills -->
        <div class="flex flex-wrap gap-1.5 text-xs">
          <button data-scene="0" class="scene-pill px-2.5 py-1 bg-sky-600 text-white rounded font-medium">1. Problem</button>
          <button data-scene="1" class="scene-pill px-2.5 py-1 bg-slate-800 text-slate-400 rounded hover:text-white">2. Live Sign</button>
          <button data-scene="2" class="scene-pill px-2.5 py-1 bg-slate-800 text-slate-400 rounded hover:text-white">3. Avatar</button>
          <button data-scene="3" class="scene-pill px-2.5 py-1 bg-slate-800 text-slate-400 rounded hover:text-white">4. Two-Way</button>
          <button data-scene="4" class="scene-pill px-2.5 py-1 bg-slate-800 text-slate-400 rounded hover:text-white">5. Arena</button>
          <button data-scene="5" class="scene-pill px-2.5 py-1 bg-slate-800 text-slate-400 rounded hover:text-white">6. SOS</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('video-canvas');
    const ctx = canvas.getContext('2d');
    const timerEl = document.getElementById('video-timer');
    const titleEl = document.getElementById('scene-title-hud');
    const playBtn = document.getElementById('btn-play-pause');
    const restartBtn = document.getElementById('btn-restart');
    const recordBtn = document.getElementById('btn-record-video');
    const recordBtnText = document.getElementById('record-btn-text');

    let isPlaying = false;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let currentTime = 0;
    const totalDuration = 60; // 60 seconds showcase
    let currentScene = 0;
    let lastTimestamp = performance.now();

    const scenes = [
      {
        id: 0,
        title: "Scene 1: Introduction & The 18M Deaf Citizen Reality",
        duration: 10,
        tag: "THE PROBLEM",
        render: (t) => {
          // Title slide presentation
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, 960, 540);

          // Tricolor stripe
          const grad = ctx.createLinearGradient(0, 0, 960, 0);
          grad.addColorStop(0, '#ff9933');
          grad.addColorStop(0.5, '#ffffff');
          grad.addColorStop(1, '#138808');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 960, 6);

          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 36px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('SignBridge (साइन-ब्रिज)', 480, 160);

          ctx.fillStyle = '#f8fafc';
          ctx.font = '20px sans-serif';
          ctx.fillText('Bi-Directional Indian Sign Language (ISL) <-> English & Hindi Platform', 480, 210);

          // 3 Stat Boxes
          const drawCard = (x, val, lbl, col) => {
            ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
            ctx.fillRect(x, 260, 220, 120);
            ctx.strokeStyle = col;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x, 260, 220, 120);

            ctx.fillStyle = col;
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText(val, x + 110, 315);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '12px sans-serif';
            ctx.fillText(lbl, x + 110, 350);
          };

          drawCard(120, '18,000,000+', 'Deaf Citizens in India', '#ef4444');
          drawCard(370, '< 300', 'Certified Interpreters', '#f59e0b');
          drawCard(620, '1 : 60,000', 'Extreme Interpreter Deficit', '#a855f7');

          ctx.fillStyle = '#94a3b8';
          ctx.font = 'italic 13px sans-serif';
          ctx.fillText('Demonstrating real-time communication solutions for emergency and civic life...', 480, 440);
        }
      },
      {
        id: 1,
        title: "Scene 2: Live Camera Sign Recognition (ISL -> English & Hindi)",
        duration: 10,
        tag: "LIVE VISION ENGINE",
        render: (t) => {
          // Camera Studio simulation
          ctx.fillStyle = '#080c14';
          ctx.fillRect(0, 0, 960, 540);

          // Left Viewfinder
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.strokeRect(60, 60, 480, 360);

          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.fillRect(60, 60, 480, 360);

          // Simulated Hands (Namaste / Doctor)
          const wave = Math.sin(t * 4) * 10;
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
          ctx.lineWidth = 4;

          // Hand 1
          ctx.beginPath();
          ctx.moveTo(270 + wave, 280);
          ctx.lineTo(260 + wave, 190);
          ctx.stroke();

          // Hand 2
          ctx.beginPath();
          ctx.moveTo(330 - wave, 280);
          ctx.lineTo(340 - wave, 190);
          ctx.stroke();

          // Knuckles
          ctx.fillStyle = '#38bdf8';
          [260, 275, 290, 310, 325, 340].forEach(kx => {
            ctx.beginPath();
            ctx.arc(kx, 190 + Math.sin(kx) * 10, 6, 0, Math.PI * 2);
            ctx.fill();
          });

          // Hand Bounding box
          ctx.strokeStyle = '#10b981';
          ctx.strokeRect(230, 160, 180, 160);
          ctx.fillStyle = '#10b981';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText('✓ HAND DETECTED: Anjali Mudra', 240, 150);

          // Right Subtitle Card
          ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
          ctx.fillRect(580, 60, 320, 360);
          ctx.strokeStyle = '#334155';
          ctx.strokeRect(580, 60, 320, 360);

          ctx.fillStyle = '#94a3b8';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'start';
          ctx.fillText('LIVE RECOGNIZED SIGN:', 600, 100);

          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 28px sans-serif';
          ctx.fillText('NAMASTE (HELLO)', 600, 140);

          ctx.fillStyle = '#10b981';
          ctx.font = 'bold 24px sans-serif';
          ctx.fillText('नमस्ते (स्वागत है)', 600, 180);

          ctx.fillStyle = '#e2e8f0';
          ctx.font = '12px sans-serif';
          ctx.fillText('Audio Output: Vocalized via Speech TTS', 600, 230);
          ctx.fillText('Confidence: 96% (ISLRTC Template Match)', 600, 260);
          ctx.fillText('FPS: 60 FPS | Latency: 42ms', 600, 290);
        }
      },
      {
        id: 2,
        title: "Scene 3: Speech & Text -> Expressive Kinematic ISL Avatar",
        duration: 10,
        tag: "ISL SOV NLP AVATAR",
        render: (t) => {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, 960, 540);

          // Spoken prompt
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(60, 60, 840, 70);
          ctx.strokeStyle = '#38bdf8';
          ctx.strokeRect(60, 60, 840, 70);

          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'start';
          ctx.fillText('SPOKEN INPUT: "Where is the hospital?" (अस्पताल कहाँ है?)', 80, 90);

          ctx.fillStyle = '#10b981';
          ctx.font = 'bold 13px sans-serif';
          ctx.fillText('ISL GRAMMAR TRANSFORM: [ HOSPITAL ] [ WHERE ] (Copula dropped, question at end)', 80, 115);

          // Avatar drawing on center-right
          const cx = 480;
          const cy = 280;

          // Head
          ctx.beginPath();
          ctx.arc(cx, cy - 60, 40, 0, Math.PI * 2);
          ctx.fillStyle = '#e29b64';
          ctx.fill();

          // Eyes & Eyebrows
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(cx - 14, cy - 65, 4, 0, Math.PI * 2);
          ctx.arc(cx + 14, cy - 65, 4, 0, Math.PI * 2);
          ctx.fill();

          // Question raised eyebrows
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(cx - 24, cy - 78);
          ctx.lineTo(cx - 8, cy - 80);
          ctx.moveTo(cx + 8, cy - 80);
          ctx.lineTo(cx + 24, cy - 78);
          ctx.stroke();

          // Smile
          ctx.beginPath();
          ctx.arc(cx, cy - 48, 12, 0.2 * Math.PI, 0.8 * Math.PI);
          ctx.stroke();

          // Torso
          ctx.fillStyle = '#1e3a8a';
          ctx.fillRect(cx - 50, cy - 20, 100, 120);

          // Arms animated in sign
          const armWave = Math.sin(t * 3) * 20;
          ctx.strokeStyle = '#1e3a8a';
          ctx.lineWidth = 14;
          ctx.beginPath();
          ctx.moveTo(cx - 50, cy);
          ctx.lineTo(cx - 90, cy + 50);
          ctx.lineTo(cx - 50 + armWave, cy + 90);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(cx + 50, cy);
          ctx.lineTo(cx + 90, cy + 50);
          ctx.lineTo(cx + 50 - armWave, cy + 90);
          ctx.stroke();

          ctx.fillStyle = '#cbd5e1';
          ctx.font = 'bold 14px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Avatar Signing: [HOSPITAL] -> [WHERE]', 480, 480);
        }
      },
      {
        id: 3,
        title: "Scene 4: Two-Way Conversational Dialogue Bridge (Doctor & Patient)",
        duration: 10,
        tag: "CIVIC BRIDGE",
        render: (t) => {
          ctx.fillStyle = '#080c14';
          ctx.fillRect(0, 0, 960, 540);

          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 20px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Two-Way Dialogue Bridge: ER Hospital Counter Scenario', 480, 50);

          // Hearing Doctor message
          ctx.fillStyle = 'rgba(2, 132, 199, 0.25)';
          ctx.fillRect(100, 90, 760, 80);
          ctx.strokeStyle = '#0284c7';
          ctx.strokeRect(100, 90, 760, 80);
          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'start';
          ctx.fillText('👨‍⚕️ Hearing Doctor (Voice Audio):', 120, 115);
          ctx.fillStyle = '#ffffff';
          ctx.font = '14px sans-serif';
          ctx.fillText('"Hello, what symptoms are you feeling? Where is the pain?"', 120, 145);

          // Deaf Signer message
          ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
          ctx.fillRect(100, 200, 760, 80);
          ctx.strokeStyle = '#10b981';
          ctx.strokeRect(100, 200, 760, 80);
          ctx.fillStyle = '#34d399';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText('🤟 Deaf Patient (Camera ISL Gestures):', 120, 225);
          ctx.fillStyle = '#ffffff';
          ctx.font = '14px sans-serif';
          ctx.fillText('"Chest Pain Severe Need Doctor (मुझे सीने में तेज़ दर्द है, डॉक्टर चाहिए)"', 120, 255);

          // Status bar
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(100, 310, 760, 50);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '12px sans-serif';
          ctx.fillText('✓ Real-time Speech-to-Speech & Subtitle Transcription Active', 120, 340);
          ctx.fillText('✓ 1-Click Session Export to PDF/TXT for medical records', 520, 340);
        }
      },
      {
        id: 4,
        title: "Scene 5: AI Practice & Coaching Arena with Real-Time Accuracy",
        duration: 10,
        tag: "GAMIFIED ARENA",
        render: (t) => {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, 960, 540);

          ctx.fillStyle = '#a855f7';
          ctx.font = 'bold 20px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('ISL AI Practice Arena: Interactive Gesture Coaching', 480, 50);

          // Target vs User
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(120, 90, 340, 260);
          ctx.strokeStyle = '#38bdf8';
          ctx.strokeRect(120, 90, 340, 260);
          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('TARGET SIGN: Doctor (डॉक्टर)', 290, 130);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '12px sans-serif';
          ctx.fillText('Tap index & middle fingers on wrist pulse twice.', 290, 170);

          ctx.fillStyle = '#1e293b';
          ctx.fillRect(500, 90, 340, 260);
          ctx.strokeStyle = '#10b981';
          ctx.strokeRect(500, 90, 340, 260);
          ctx.fillStyle = '#10b981';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('YOUR CAMERA FEED', 670, 130);

          // Accuracy meter
          ctx.fillStyle = '#34d399';
          ctx.font = 'bold 36px sans-serif';
          ctx.fillText('94% MATCH', 670, 200);

          ctx.fillStyle = '#f8fafc';
          ctx.font = '13px sans-serif';
          ctx.fillText('✓ Perfect finger alignment! Hold steady for 1.8s', 670, 240);

          // Progress bar
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(120, 380, 720, 20);
          ctx.fillStyle = '#10b981';
          ctx.fillRect(120, 380, 720 * 0.94, 20);
        }
      },
      {
        id: 5,
        title: "Scene 6: Emergency SOS & Life-Saving Healthcare QuickDeck",
        duration: 10,
        tag: "EMERGENCY SOS",
        render: (t) => {
          ctx.fillStyle = '#090d16';
          ctx.fillRect(0, 0, 960, 540);

          ctx.fillStyle = '#ef4444';
          ctx.font = 'bold 22px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Emergency SOS: 1-Tap Life-Saving Voice & Sign Broadcast', 480, 50);

          const drawSOS = (x, y, icon, title, desc) => {
            ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
            ctx.fillRect(x, y, 220, 110);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x, y, 220, 110);

            ctx.fillStyle = '#ef4444';
            ctx.font = '24px sans-serif';
            ctx.fillText(icon, x + 30, y + 45);

            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 15px sans-serif';
            ctx.textAlign = 'start';
            ctx.fillText(title, x + 60, y + 45);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '11px sans-serif';
            ctx.fillText(desc, x + 20, y + 80);
          };

          drawSOS(120, 90, '🩺', 'Call Doctor', 'मुझे डॉक्टर चाहिए');
          drawSOS(370, 90, '🏥', 'Hospital', 'अस्पताल ले जाएं');
          drawSOS(620, 90, '⚡', 'Severe Pain', 'तेज़ दर्द हो रहा है');

          drawSOS(120, 230, '💧', 'Need Water', 'पीने का पानी दें');
          drawSOS(370, 230, '🚨', 'Call Police', 'पुलिस को बुलाएं');
          drawSOS(620, 230, '💊', 'Medicine', 'दवाई की ज़रूरत');

          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 14px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('SignBridge: Giving voice to silence. Ready for deployment.', 480, 420);
        }
      }
    ];

    function drawFrame(timestamp) {
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += dt;
        if (currentTime >= totalDuration) {
          currentTime = 0;
        }

        // Determine active scene
        let accTime = 0;
        for (let i = 0; i < scenes.length; i++) {
          accTime += scenes[i].duration;
          if (currentTime < accTime) {
            currentScene = i;
            break;
          }
        }
      }

      // Update timer HUD
      const mins = String(Math.floor(currentTime / 60)).padStart(2, '0');
      const secs = String(Math.floor(currentTime % 60)).padStart(2, '0');
      timerEl.textContent = `${mins}:${secs} / 01:00`;
      titleEl.textContent = scenes[currentScene].title;

      // Update scene pills
      document.querySelectorAll('.scene-pill').forEach((pill, idx) => {
        if (idx === currentScene) {
          pill.className = 'scene-pill px-2.5 py-1 bg-sky-600 text-white rounded font-medium';
        } else {
          pill.className = 'scene-pill px-2.5 py-1 bg-slate-800 text-slate-400 rounded hover:text-white';
        }
      });

      // Render current scene
      scenes[currentScene].render(currentTime);

      requestAnimationFrame(drawFrame);
    }

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸ Pause Walkthrough' : '▶ Play Walkthrough';
    });

    restartBtn.addEventListener('click', () => {
      currentTime = 0;
      currentScene = 0;
      isPlaying = true;
      playBtn.textContent = '⏸ Pause Walkthrough';
    });

    document.querySelectorAll('.scene-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const scIdx = parseInt(btn.dataset.scene, 10);
        currentScene = scIdx;
        currentTime = scIdx * 10;
      });
    });

    // --- Record & Download WebM/MP4 Video ---
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      recordedChunks = [];
      const stream = canvas.captureStream(30); // 30 FPS stream from canvas

      try {
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SignBridge_Demo_Walkthrough_${Date.now()}.webm`;
        a.click();
        recordBtnText.textContent = '🎬 Record & Export Video (.webm)';
        recordBtn.classList.remove('bg-amber-600');
        recordBtn.classList.add('bg-rose-600');
        isRecording = false;
      };

      mediaRecorder.start();
      isRecording = true;
      currentTime = 0;
      isPlaying = true;
      recordBtnText.textContent = '⏹ Stop & Save Video';
      recordBtn.classList.remove('bg-rose-600');
      recordBtn.classList.add('bg-amber-600');

      // Auto-stop after full 60s run
      setTimeout(() => {
        if (isRecording) stopRecording();
      }, totalDuration * 1000);
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    // Auto-start playback
    isPlaying = true;
    playBtn.textContent = '⏸ Pause Walkthrough';
    requestAnimationFrame(drawFrame);
  </script>
</body>
</html>
